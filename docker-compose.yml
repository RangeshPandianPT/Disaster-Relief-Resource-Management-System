version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: drrms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: drrms_root_password
      MYSQL_DATABASE: drrms_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically initialize database with schema and sample data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql
      - ./database/03_queries.sql:/docker-entrypoint-initdb.d/03_queries.sql
      - ./database/04_views.sql:/docker-entrypoint-initdb.d/04_views.sql
      - ./database/05_triggers.sql:/docker-entrypoint-initdb.d/05_triggers.sql
      - ./database/06_procedures.sql:/docker-entrypoint-initdb.d/06_procedures.sql
      - ./database/07_functions.sql:/docker-entrypoint-initdb.d/07_functions.sql
      - ./database/08_transactions.sql:/docker-entrypoint-initdb.d/08_transactions.sql
      - ./database/09_cursors.sql:/docker-entrypoint-initdb.d/09_cursors.sql
      - ./database/10_events.sql:/docker-entrypoint-initdb.d/10_events.sql
      - ./database/11_security.sql:/docker-entrypoint-initdb.d/11_security.sql
      - ./database/12_audit.sql:/docker-entrypoint-initdb.d/12_audit.sql
      - ./database/13_performance.sql:/docker-entrypoint-initdb.d/13_performance.sql

  webapp:
    build: 
      context: ./webapp
      dockerfile: Dockerfile
    container_name: drrms_webapp
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: drrms_root_password
      DB_NAME: drrms_db
    depends_on:
      - db

volumes:
  db_data:
